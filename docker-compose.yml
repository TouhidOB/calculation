name: calchub

services:
  # Django REST API backend
  backend:
    build: ./backend
    container_name: calchub_backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Next.js frontend (3000 is taken by another stack, exposed on 3001)
  frontend:
    build: ./frontend
    container_name: calchub_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy