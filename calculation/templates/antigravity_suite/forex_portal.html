{% extends "base_antigravity.html" %}

{% block title %}Forex Portal - Calculation IT Suite{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="ag-card">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-dark">Forex Portal</h1>
                <p class="lead opacity-50">Global currency exchange and change optimization.</p>
            </div>

            <form id="forex-form">
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="ag-input-group">
                            <label class="ag-input-label">Source Currency (USD)</label>
                            <input type="number" class="ag-input" id="source-amount" placeholder="0.00" step="0.01"
                                required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="ag-input-group">
                            <label class="ag-input-label">Exchange Rate (to EUR)</label>
                            <input type="number" class="ag-input" id="exchange-rate" step="0.0001"
                                required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="ag-input-group">
                            <label class="ag-input-label">Fee (%)</label>
                            <input type="number" class="ag-input" id="exchange-fee" step="0.1" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="ag-button">
                    <i class="bi bi-arrows-left-right"></i>
                    CALCULATE EXCHANGE
                </button>
            </form>

            <div id="result-container" class="ag-result d-none">
                <p class="ag-result__label">Net Amount in EUR</p>
                <h2 class="ag-result__value" id="net-amount">€0.00</h2>

                <div class="ag-grid" id="denomination-grid">
                    <!-- Euro denominations -->
                </div>
            </div>

            <div id="error-alert" class="alert alert-danger mt-4 d-none" role="alert">
                <i class="bi bi-exclamation-octagon"></i>
                <span id="error-message"></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const EURO_DENOMINATIONS = [
        { label: '€500 Bill', value: 500, type: 'bill' },
        { label: '€200 Bill', value: 200, type: 'bill' },
        { label: '€100 Bill', value: 100, type: 'bill' },
        { label: '€50 Bill', value: 50, type: 'bill' },
        { label: '€20 Bill', value: 20, type: 'bill' },
        { label: '€10 Bill', value: 10, type: 'bill' },
        { label: '€5 Bill', value: 5, type: 'bill' },
        { label: '€2 Coin', value: 2, type: 'coin' },
        { label: '€1 Coin', value: 1, type: 'coin' },
        { label: '50c Coin', value: 0.50, type: 'coin' },
        { label: '20c Coin', value: 0.20, type: 'coin' },
        { label: '10c Coin', value: 0.10, type: 'coin' },
        { label: '5c Coin', value: 0.05, type: 'coin' },
        { label: '2c Coin', value: 0.02, type: 'coin' },
        { label: '1c Coin', value: 0.01, type: 'coin' }
    ];

    const BILL_ICON = `
        <svg class="ag-denomination__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            <circle cx="12" cy="12" r="2"></circle>
            <path d="M6 12h.01M18 12h.01"></path>
        </svg>
    `;

    const COIN_ICON = `
        <svg class="ag-denomination__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 8v8M8 12h8"></path>
        </svg>
    `;

    document.getElementById('forex-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const source = parseFloat(document.getElementById('source-amount').value);
        const rate = parseFloat(document.getElementById('exchange-rate').value);
        const feePercent = parseFloat(document.getElementById('exchange-fee').value);
        const grid = document.getElementById('denomination-grid');

        const gross = source * rate;
        const fee = gross * (feePercent / 100);
        const net = gross - fee;

        document.getElementById('net-amount').innerText = `€${net.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        // Greedy Algorithm for Euro
        let remaining = Math.round(net * 100);
        grid.innerHTML = '';

        EURO_DENOMINATIONS.forEach(denom => {
            const denomCents = Math.round(denom.value * 100);
            const count = Math.floor(remaining / denomCents);

            if (count > 0) {
                remaining %= denomCents;

                const card = document.createElement('div');
                card.className = 'ag-denomination ag-animate-up';
                card.style.animationDelay = `${(grid.children.length * 0.05)}s`;

                const icon = denom.type === 'bill' ? BILL_ICON : COIN_ICON;

                card.innerHTML = `
                    ${icon}
                    <span class="ag-denomination__count">${count}x</span>
                    <span class="ag-denomination__label">${denom.label}</span>
                `;
                grid.appendChild(card);
            }
        });

        document.getElementById('result-container').classList.remove('d-none');
        document.getElementById('error-alert').classList.add('d-none');
    });
</script>
<style>
    .d-none {
        display: none !important;
    }
</style>
{% endblock %}
